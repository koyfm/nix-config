name: "Flake Check"

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@v31.11.5
      with:
        extra_nix_config: |
          accept-flake-config = true
    - run: nix flake check
